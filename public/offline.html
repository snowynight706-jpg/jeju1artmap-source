<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F6F6" />
    <title>연결 확인 · 제주 원도심 맵</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f6f6f6;
        color: #2d2d2d;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }
      main {
        width: min(420px, 100%);
        padding: 30px 26px;
        border: 1px solid #dedede;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 16px 44px rgb(43 45 51 / 10%);
        text-align: center;
      }
      img { width: 84px; height: 84px; }
      h1 { margin: 18px 0 8px; font-size: 20px; letter-spacing: -.04em; }
      p { margin: 0; color: #646464; font-size: 14px; line-height: 1.65; }
      button {
        min-height: 42px;
        margin-top: 22px;
        padding: 0 18px;
        border: 1px solid #bfc1c5;
        border-radius: 10px;
        background: #2b2d33;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>원도심 맵의 장소와 행사 정보는 최신 서버 데이터를 사용합니다. 연결이 복구되면 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
